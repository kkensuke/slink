name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged release
    runs-on: macos-14

    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Verify the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          tag_version="${RELEASE_TAG#v}"
          cargo_version="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "tag $RELEASE_TAG does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

      - name: Verify and build
        run: |
          cargo +stable fmt --check
          cargo +stable clippy --locked --all-targets -- -D warnings
          cargo +stable test --locked
          bash tests/apfs_case_modes.sh
          cargo +stable build --locked --release

  release:
    name: Publish GitHub and Homebrew releases
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out the Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: kkensuke/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --verify-tag
          fi

      - name: Render the Homebrew formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive_url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$RELEASE_TAG.tar.gz"
          curl --fail --location --retry 5 "$archive_url" --output "$RUNNER_TEMP/source.tar.gz"
          source_sha256="$(sha256sum "$RUNNER_TEMP/source.tar.gz" | cut -d ' ' -f 1)"
          python3 scripts/render_homebrew_formula.py \
            --version "${RELEASE_TAG#v}" \
            --source-sha256 "$source_sha256" \
            --output "$RUNNER_TEMP/slink.rb"

      - name: Publish the Homebrew formula
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        working-directory: homebrew-tap
        run: |
          mkdir -p Formula
          cp "$RUNNER_TEMP/slink.rb" Formula/slink.rb
          git diff --check -- Formula/slink.rb
          git add Formula/slink.rb
          if git diff --cached --quiet -- Formula/slink.rb; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "slink ${RELEASE_VERSION#v}"
          git push origin HEAD:main
