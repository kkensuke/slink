name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Formatting
        run: |
          if ! cargo +stable fmt --check; then
            cargo +stable fmt
            git diff -- . > "$RUNNER_TEMP/rustfmt.diff"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rustfmt-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/rustfmt.diff
          if-no-files-found: ignore
          retention-days: 1
      - name: Lints
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo +stable test --locked
      - name: Release build
        run: cargo +stable build --locked --release
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: slink-${{ runner.os }}-${{ runner.arch }}
          path: target/release/slink
          retention-days: 14
